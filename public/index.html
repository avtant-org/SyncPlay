<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncPlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="landing">
        <h1>SyncPlay</h1>
        <p>Watch local videos together in perfect sync.</p>
        
        <div class="card" id="join-card">
            <div class="form-group">
                <label for="display-name">Your Name</label>
                <input type="text" id="display-name" placeholder="e.g. Alex" autocomplete="off">
            </div>
            
            <div id="room-input-group" class="form-group hidden">
                <label for="room-id">Room ID</label>
                <input type="text" id="room-id" placeholder="e.g. A7K9P2" autocomplete="off" style="text-transform: uppercase;">
            </div>

            <button id="btn-create" class="btn mb-4">Create Room</button>
            <button id="btn-join-mode" class="btn secondary mb-4">Join an existing room</button>
            <button id="btn-join-submit" class="btn hidden">Join Room</button>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
